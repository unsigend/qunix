# C header macro will only keep the config entries whose key starts with CONFIG_
# Always use make gen-config to re-generate the config.h file after changing this file

# architecture
# if change ARCH, also need to change the TOOLCHAIN in Makefile
ARCH = i386
TOOLCHAIN = i686-elf-

# CPU
CONFIG_MAX_CPUS = 1
CONFIG_SMP = 0

# debug
CONFIG_DEBUG = 0
CONFIG_DEBUG_SPINLOCK = 0

# version
CONFIG_VERSION_MAJOR = 0
CONFIG_VERSION_MINOR = 1
CONFIG_VERSION_PATCH = 1

# kernel
KERNEL_NAME = qunix
CONFIG_PAGESIZE = 4096
CONFIG_PAGESHIFT = 12

# pmm
CONFIG_PMM_SIMPLE = 1
CONFIG_PMM_BITMAP = 0
CONFIG_PMM_BUDDY = 0

# clock
CONFIG_CLOCK_HZ = 1000